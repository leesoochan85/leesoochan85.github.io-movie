{% extends "base.html" %}

{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/mypage.css' %}">
{% endblock %}

{% block content %}
<div class="mypage-container">
  <h2>회원 정보</h2>
  <hr>
  <div class="user-info">
    <p><strong>아이디:</strong> {{ user.username }}</p>
    <p><strong>이메일:</strong> {{ user.email }}</p>
    <p><strong>가입일:</strong> {{ user.date_joined|date:"Y년 m월 d일 H:i" }}</p>
  </div>
</div>
{% endblock %}
