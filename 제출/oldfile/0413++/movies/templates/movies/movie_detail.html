<!-- templates/movies/movie_detail.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }} - 상세 정보</title>
</head>
<body>
    <h1>{{ movie.title }}</h1>
    <p><strong>장르:</strong> {{ movie.genres }}</p>
    <p><strong>개봉일:</strong> {{ movie.release_date }}</p>
    <p><strong>평점:</strong> {{ movie.vote_average }}</p>
    <p><strong>줄거리:</strong> {{ movie.overview }}</p>

    <h2>📝 리뷰</h2>
    {% if reviews %}
        <ul>
            {% for review in reviews %}
                <li><strong>{{ review.author }}</strong>: {{ review.content }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>아직 리뷰가 없습니다.</p>
    {% endif %}
</body>
</html>
