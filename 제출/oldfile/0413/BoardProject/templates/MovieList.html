{% extends "base.html" %}
{% load static %}

{% block title %}영화 목록{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/MovieList.css' %}">
{% endblock %}

{% block content %}
<div class="movie-board-wrapper">
  <h2 class="board-title">추천 영화 목록</h2>

  <div class="movie-layout">
    <!-- 영화 리스트 - 리스트는 MovieList.js에서 받아옵니다. -->
    <section class="movie-list-area">
      <div class="post-grid" id="movieGrid"></div>
      <div class="pagination" id="pagination"></div>
    </section>

    <!-- 장르 필터 -->
    <aside class="genre-filter">
      <h4>장르 선택</h4>
      <form id="genreForm">
        <!-- 마찬가지로 JS에서 장르 체크박스를 렌더링합니다 -->
      </form>
    </aside>
  </div>
</div>

<script src="{% static 'js/MovieList.js' %}"></script>
{% endblock %}
