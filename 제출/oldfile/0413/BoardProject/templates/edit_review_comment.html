{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h3>댓글 수정</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.content.label_tag }}
            {{ form.content }}
        </div>
        <button type="submit" class="btn btn-primary mt-2">저장</button>
        <a href="{% url 'movie_detail' comment.movie.id %}" class="btn btn-secondary mt-2">취소</a>
    </form>
</div>
{% endblock %}
